<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 0;
      overflow: hidden;
    }

    .header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(76,79,224,0.3);
    }
    .logo img { width: 100%; height: 100%; display: block; }
    .header-text h1 { font-size: 14px; font-weight: 700; color: #e6edf3; letter-spacing: -0.3px; }
    .header-text p { font-size: 10px; color: #58a6ff; font-family: monospace; margin-top: 2px; }

    .body { padding: 20px; }

    .connected-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .status-icon {
      width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .status-icon.green { background: rgba(63,185,80,0.12); border: 2px solid rgba(63,185,80,0.3); }
    .status-icon.red { background: rgba(248,81,73,0.12); border: 2px solid rgba(248,81,73,0.3); }
    .status-icon svg { width: 22px; height: 22px; }
    .status-icon.green svg { color: #3fb950; }
    .status-icon.red svg { color: #f85149; }

    .status-label { font-size: 14px; font-weight: 600; color: #e6edf3; margin-bottom: 4px; }
    .status-sub { font-size: 11px; color: #8b949e; font-family: monospace; }

    .btn-disconnect {
      width: 100%; margin-top: 16px; padding: 10px;
      background: transparent; border: 1px solid rgba(248,81,73,0.3);
      border-radius: 8px; color: #f85149; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-disconnect:hover { background: rgba(248,81,73,0.1); border-color: rgba(248,81,73,0.5); }

    .connect-form { display: flex; flex-direction: column; gap: 10px; }
    .input-wrap {
      background: #0d1117; border: 1px solid #21262d; border-radius: 10px;
      padding: 0; display: flex; align-items: center; overflow: hidden;
      transition: border-color 0.15s;
    }
    .input-wrap:focus-within { border-color: #58a6ff; }
    .input-icon { padding: 0 12px; color: #484f58; flex-shrink: 0; }
    .input-wrap input {
      flex: 1; background: transparent; border: none; padding: 12px 0;
      color: #e6edf3; font-size: 12px; font-family: monospace; outline: none;
    }
    .input-wrap input::placeholder { color: #484f58; }

    .btn-connect {
      width: 100%; padding: 11px;
      background: linear-gradient(135deg, #388bfd, #a78bfa);
      border: none; border-radius: 10px; color: white;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; letter-spacing: 0.2px;
    }
    .btn-connect:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(56,139,253,0.3); }
    .btn-connect:active { transform: translateY(0); }

    .msg { font-size: 11px; text-align: center; margin-top: 4px; font-family: monospace; min-height: 16px; }
    .msg.success { color: #3fb950; }
    .msg.error { color: #f85149; }

    .footer {
      padding: 12px 20px; border-top: 1px solid #21262d;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .footer-dot { width: 5px; height: 5px; border-radius: 50%; }
    .footer-dot.green { background: #3fb950; box-shadow: 0 0 6px rgba(63,185,80,0.5); }
    .footer-dot.red { background: #f85149; }
    .footer span { font-size: 10px; color: #484f58; font-family: monospace; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><img src="favicon.svg" alt="DSA Master"></div>
    <div class="header-text">
      <h1>DSA Master</h1>
      <p>spaced repetition</p>
    </div>
  </div>
  <div class="body">
    <div id="content"></div>
  </div>
  <div class="footer">
    <div class="footer-dot" id="footerDot"></div>
    <span id="footerText">v1.0.0</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
